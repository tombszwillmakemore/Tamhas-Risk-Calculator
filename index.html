<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Risk Calc">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0f172a">
<title>Futures Risk Calculator</title>
<style>
  :root {
    --bg: #0f172a;
    --card: #111c33;
    --border: #243251;
    --text: #e8eefc;
    --muted: #8fa0c4;
    --accent: #38bdf8;
    --good: #22c55e;
    --bad: #f87171;
    --warn: #fbbf24;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif; }
  body { min-height: 100vh; padding: max(20px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom)); }
  .wrap { max-width: 460px; margin: 0 auto; }
  h1 { font-size: 22px; font-weight: 700; margin: 8px 0 4px; letter-spacing: -0.01em; }
  .sub { color: var(--muted); font-size: 14px; margin: 0 0 20px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 18px; margin-bottom: 16px; }
  label { display: block; font-size: 13px; font-weight: 600; color: var(--muted); margin: 0 0 6px; text-transform: uppercase; letter-spacing: .04em; }
  .field { margin-bottom: 16px; }
  .field:last-child { margin-bottom: 0; }
  .input-wrap { position: relative; }
  .prefix, .suffix { position: absolute; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 17px; pointer-events: none; }
  .prefix { left: 14px; }
  .suffix { right: 14px; font-size: 14px; }
  input {
    width: 100%; height: 52px; font-size: 18px; /* 16px+ prevents iOS zoom on focus */
    color: var(--text); background: #0b1428; border: 1px solid var(--border);
    border-radius: 12px; padding: 0 14px; outline: none; -webkit-appearance: none; appearance: none;
  }
  input.money { padding-left: 28px; }
  input.pts { padding-right: 56px; }
  input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(56,189,248,.18); }
  .result { text-align: center; }
  .result .big { font-size: 15px; color: var(--muted); margin-bottom: 6px; text-transform: uppercase; letter-spacing: .05em; font-weight: 600; }
  .result .value { font-size: 56px; font-weight: 800; line-height: 1.05; color: var(--good); }
  .result .value small { display: block; font-size: 16px; font-weight: 600; color: var(--muted); margin-top: 4px; }
  .result .msg { font-size: 19px; font-weight: 700; line-height: 1.3; padding: 6px 4px; }
  .result.warn .msg { color: var(--bad); }
  .result.info .msg { color: var(--warn); }
  .result.idle .msg { color: var(--muted); font-weight: 500; font-size: 16px; }
  .rows { margin-top: 16px; border-top: 1px solid var(--border); }
  .row { display: flex; justify-content: space-between; align-items: baseline; padding: 13px 0; border-bottom: 1px solid var(--border); font-size: 16px; }
  .row:last-child { border-bottom: 0; padding-bottom: 0; }
  .row span:first-child { color: var(--muted); }
  .row span:last-child { font-weight: 700; font-variant-numeric: tabular-nums; }
  .foot { text-align: center; color: var(--muted); font-size: 12px; margin-top: 8px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Futures Risk Calculator</h1>
  <p class="sub">$0.20 per point per contract</p>

  <div class="card">
    <div class="field">
      <label for="stop">Stop-loss distance</label>
      <div class="input-wrap">
        <input id="stop" class="pts" type="text" inputmode="decimal" autocomplete="off" placeholder="e.g. 500">
        <span class="suffix">points</span>
      </div>
    </div>
    <div class="field">
      <label for="minRisk">Minimum dollar risk</label>
      <div class="input-wrap">
        <span class="prefix">$</span>
        <input id="minRisk" class="money" type="text" inputmode="decimal" autocomplete="off" placeholder="e.g. 30">
      </div>
    </div>
    <div class="field">
      <label for="maxRisk">Maximum dollar risk</label>
      <div class="input-wrap">
        <span class="prefix">$</span>
        <input id="maxRisk" class="money" type="text" inputmode="decimal" autocomplete="off" placeholder="e.g. 35">
      </div>
    </div>
  </div>

  <div class="card result idle" id="resultCard" aria-live="polite">
    <div class="big" id="resultLabel">Result</div>
    <div id="resultMain"><div class="msg">Enter your stop distance and risk range.</div></div>
    <div class="rows">
      <div class="row"><span>Risk per contract</span><span id="perContract">—</span></div>
      <div class="row"><span>Total planned risk</span><span id="totalRisk">—</span></div>
    </div>
  </div>

  <div class="foot">Calculated on your device. Not financial advice.</div>
</div>

<script>
(function () {
  // Fixed contract value: $0.20 per point per contract = 20 cents.
  // All math is done in whole cents to avoid floating-point rounding errors.
  var CENTS_PER_POINT = 20;

  var stopEl = document.getElementById('stop');
  var minEl = document.getElementById('minRisk');
  var maxEl = document.getElementById('maxRisk');
  var card = document.getElementById('resultCard');
  var label = document.getElementById('resultLabel');
  var main = document.getElementById('resultMain');
  var perEl = document.getElementById('perContract');
  var totEl = document.getElementById('totalRisk');

  function parse(el) {
    var s = el.value.replace(/[$,\s]/g, '');
    if (s === '' || !/^\d*\.?\d+$|^\d+\.$/.test(s)) return NaN;
    return parseFloat(s);
  }
  function fmt(cents) {
    return '$' + (cents / 100).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }
  function show(kind, labelText, html, per, tot) {
    card.className = 'card result ' + kind;
    label.textContent = labelText;
    main.innerHTML = html;
    perEl.textContent = per;
    totEl.textContent = tot;
  }
  function msg(t) { return '<div class="msg">' + t + '</div>'; }

  function calculate() {
    var stop = parse(stopEl), min = parse(minEl), max = parse(maxEl);

    if (isNaN(stop) || isNaN(min) || isNaN(max)) {
      show('idle', 'Result', msg('Enter your stop distance and risk range.'), '—', '—');
      return;
    }
    if (stop <= 0 || max <= 0) {
      show('idle', 'Result', msg('Stop distance and maximum risk must be greater than zero.'), '—', '—');
      return;
    }
    if (min > max) {
      show('idle', 'Result', msg('Minimum risk cannot be greater than maximum risk.'), '—', '—');
      return;
    }

    var perCents = Math.round(stop * CENTS_PER_POINT);   // risk per contract in cents
    var minCents = Math.round(min * 100);
    var maxCents = Math.round(max * 100);

    if (perCents > maxCents) {
      show('warn', 'Warning',
        msg('Stop too large, even one contract exceeds your maximum risk.'),
        fmt(perCents), '—');
      return;
    }

    var contracts = Math.floor(maxCents / perCents);      // largest whole number within max (never rounds up)
    var totalCents = contracts * perCents;

    if (contracts < 1 || totalCents < minCents || totalCents > maxCents) {
      show('info', 'Warning',
        msg('No contract size fits your risk range.'),
        fmt(perCents), '—');
      return;
    }

    show('', 'Recommended contracts',
      '<div class="value">' + contracts + '<small>contract' + (contracts === 1 ? '' : 's') + '</small></div>',
      fmt(perCents), fmt(totalCents));
  }

  ['input', 'change', 'keyup'].forEach(function (ev) {
    stopEl.addEventListener(ev, calculate);
    minEl.addEventListener(ev, calculate);
    maxEl.addEventListener(ev, calculate);
  });
  calculate();
})();
</script>
</body>
</html>
